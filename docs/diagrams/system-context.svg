<rect x="440" y="230" width="230" height="160" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="555.0" y="250" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">ESP32 board</text>
<line x1="440" y1="262.3" x2="670" y2="262.3" stroke="#2563eb" stroke-width="1"/>
<text x="450" y="281.3" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">IGNACC Controller firmware</text>
