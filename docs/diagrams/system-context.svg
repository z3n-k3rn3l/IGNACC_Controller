<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660" role="img" aria-labelledby="t d">
<title id="t">System context: what is connected to what</title>
<desc id="d">The PC tells the ESP32 which relay to switch; the relays switch the ECU&#x27;s ACC and IGN lines.</desc>
