<text x="1210.0" y="291.1" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve"></text>
<text x="1210.0" y="308.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">CAN</text>
