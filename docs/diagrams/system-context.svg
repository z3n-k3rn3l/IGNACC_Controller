<text x="1120" y="290" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">12 V</text>
<rect x="1091.0" y="313.5" width="58.1" height="15.5" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="1120" y="324" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">ACC / IGN</text>
<rect x="940" y="450" width="150" height="56" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
<text x="1015.0" y="470" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">12 V bench supply</text>
<polyline points="1015,450 1015,385" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<polyline points="195,486 195,568 1210,568 1210,415" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#filled-blue)"/>
<rect x="540.2" y="560.0" width="319.6" height="17.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="700" y="572" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2563eb" xml:space="preserve">CAN bus · CAPL sends the ACC / IGN status signals</text>
<text x="30" y="608.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">In one sentence: the PC sends a short text such as IN1_ON over USB; the ESP32 switches relay 1, which</text>
<text x="30" y="626.75" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">turns the ECU&#x27;s ACC line on, and answers IN1_ON_OK. CAPL then sends the matching ACC signal on CAN.</text>
</svg>
