<text x="30" y="36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="bold" fill="#1f2937">System context: what is connected to what</text>
<text x="30" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4b5563">The PC tells the ESP32 which relay to switch; the relays switch the ECU&#x27;s ACC and IGN lines.</text>
