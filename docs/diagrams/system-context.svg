erWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="open-green" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#15803d" stroke-width="1.6"/></marker><marker id="hollow-green" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="diamond-green" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="filled-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="open-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#2563eb" stroke-width="1.6"/></marker><marker id="hollow-blue" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker><marker id="diamond-blue" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker></defs>
