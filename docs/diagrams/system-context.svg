<text x="1015.0" y="321.1" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">5 V coils</text>
<polyline points="880,300 940,300" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="886.5" y="279.5" width="47.0" height="15.5" rx="3" fill="#ffffff" fill-opacity="0.92"/>
