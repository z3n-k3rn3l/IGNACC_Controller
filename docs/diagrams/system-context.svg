<text x="450" y="333.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">• replies OK / FAIL / UNK_NACK</text>
