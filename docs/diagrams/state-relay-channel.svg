<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="t d">
<title id="t">State machine: one relay channel</title>
<desc id="d">Every channel (IN1 … INn) behaves the same way. OFF is the safe state.</desc>
<defs><marker id="filled-ink" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="open-ink" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#374151" stroke-width="1.6"/></marker><marker id="hollow-ink" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#374151" stroke-width="1.3"/></marker><marker id="diamond-ink" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#374151" stroke-width="1.3"/></marker><marker id="filled-red" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="open-red" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#b91c1c" stroke-width="1.6"/></marker><marker id="hollow-red" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#b91c1c" stroke-width="1.3"/></marker><marker id="diamond-red" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#b91c1c" stroke-width="1.3"/></marker><marker id="filled-green" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="open-green" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#15803d" stroke-width="1.6"/></marker><marker id="hollow-green" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="diamond-green" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="filled-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="open-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#2563eb" stroke-width="1.6"/></marker><marker id="hollow-blue" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker><marker id="diamond-blue" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker></defs>
<rect x="0" y="0" width="980" height="520" fill="#ffffff"/>
<text x="30" y="36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="bold" fill="#1f2937">State machine: one relay channel</text>
<text x="30" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4b5563">Every channel (IN1 … INn) behaves the same way. OFF is the safe state.</text>
<circle cx="70" cy="255" r="10" fill="#1f2937"/>
<rect x="150" y="205" width="210" height="100" rx="16" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="255.0" y="225" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">OFF</text>
<line x1="150" y1="237.3" x2="360" y2="237.3" stroke="#6b7280" stroke-width="1"/>
<text x="255.0" y="256.3" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">pin at OFF level</text>
<text x="255.0" y="273.7" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">(active-low: HIGH)</text>
<rect x="620" y="205" width="210" height="100" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="725.0" y="225" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">ON</text>
<line x1="620" y1="237.3" x2="830" y2="237.3" stroke="#15803d" stroke-width="1"/>
<text x="725.0" y="256.3" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">pin at ON level</text>
<text x="725.0" y="273.7" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">(active-low: LOW)</text>
<polyline points="80,255 150,255" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="96.3" y="229.0" width="31.3" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="112" y="240" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">boot</text>
<path d="M 330 205 C 400 120, 580 120, 650 205" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#filled-ink)"/>
<rect x="358.0" y="116.5" width="264.0" height="16.5" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="490" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">IN&lt;n&gt;_ON or ALL_ON  [drive + read-back OK]</text>
<rect x="440.3" y="134.5" width="99.4" height="16.5" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="490" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">/ reply …_ON_OK</text>
<path d="M 650 305 C 580 390, 400 390, 330 305" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#filled-ink)"/>
<rect x="370.2" y="356.5" width="239.6" height="16.5" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="490" y="368" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">IN&lt;n&gt;_OFF or ALL_OFF  / reply …_OFF_OK</text>
<rect x="336.7" y="374.5" width="306.7" height="16.5" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="490" y="386" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#b91c1c" xml:space="preserve">any failure on any channel  / …_FAIL (safe state)</text>
<rect x="431.1" y="392.5" width="117.7" height="16.5" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="490" y="404" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">reset or power-off</text>
<path d="M 190 305 C 160 380, 260 380, 240 306" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#filled-ink)"/>
<rect x="153.5" y="389.0" width="112.9" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="210" y="400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">IN&lt;n&gt;_OFF, ALL_OFF</text>
<rect x="153.5" y="405.0" width="112.9" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="210" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">/ drive again, _OK</text>
<path d="M 790 205 C 820 130, 720 130, 740 204" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#filled-ink)"/>
<rect x="664.0" y="101.0" width="212.1" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="770" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">IN&lt;n&gt;_ON, ALL_ON / drive again, _OK</text>
<text x="30" y="460.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">Sending the same command twice is safe (idempotent): the pin is driven again and the answer is _OK.</text>
<text x="30" y="478.75" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">If any relay fails, every relay goes to OFF — never to an unknown state.</text>
</svg>
