<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="t d">
<title id="t">State machine: app_fsm</title>
<desc id="d">Two states. All the work happens in READY, one received line at a time.</desc>
<defs><marker id="filled-ink" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="open-ink" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#374151" stroke-width="1.6"/></marker><marker id="hollow-ink" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#374151" stroke-width="1.3"/></marker><marker id="diamond-ink" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#374151" stroke-width="1.3"/></marker><marker id="filled-red" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="open-red" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#b91c1c" stroke-width="1.6"/></marker><marker id="hollow-red" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#b91c1c" stroke-width="1.3"/></marker><marker id="diamond-red" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#b91c1c" stroke-width="1.3"/></marker><marker id="filled-green" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="open-green" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#15803d" stroke-width="1.6"/></marker><marker id="hollow-green" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="diamond-green" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="filled-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="open-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#2563eb" stroke-width="1.6"/></marker><marker id="hollow-blue" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker><marker id="diamond-blue" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker></defs>
<rect x="0" y="0" width="1100" height="640" fill="#ffffff"/>
<text x="30" y="36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="bold" fill="#1f2937">State machine: app_fsm</text>
<text x="30" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4b5563">Two states. All the work happens in READY, one received line at a time.</text>
<circle cx="70" cy="155" r="10" fill="#1f2937"/>
<rect x="130" y="110" width="230" height="92" rx="16" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="245.0" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">INIT</text>
<line x1="130" y1="142.3" x2="360" y2="142.3" stroke="#6b7280" stroke-width="1"/>
<text x="140" y="161.3" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">created by main</text>
<text x="140" y="178.70000000000002" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">every line ignored (no reply)</text>
<polyline points="80,155 130,155" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="83.5" y="129.0" width="43.0" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="105" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">create</text>
<rect x="470" y="100" width="600" height="300" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="770.0" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">READY</text>
<line x1="470" y1="132.3" x2="1070" y2="132.3" stroke="#2563eb" stroke-width="1"/>
<text x="480" y="151.8" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">entry / drive ALL relays OFF (safe state)</text>
<text x="480" y="169.925" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve"></text>
<text x="480" y="188.05" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">IN&lt;n&gt;_ON | IN&lt;n&gt;_OFF, n ≤ count</text>
<text x="480" y="206.175" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">      / drive · wait 15 ms · read back  →  IN&lt;n&gt;_…_OK</text>
<text x="480" y="224.3" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">ALL_ON | ALL_OFF</text>
<text x="480" y="242.425" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">      / drive all · wait 15 ms once · read back all  →  ALL_…_OK</text>
<text x="480" y="260.55" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">HeyU   / reply  Hello IGNACC v&lt;version&gt; READY</text>
<text x="480" y="278.675" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">STATUS / reply  STATUS IN1=… IN&lt;count&gt;=…</text>
<text x="480" y="296.8" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">anything else, or n &gt; count  / reply  UNK_NACK</text>
<text x="480" y="314.925" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve"></text>
<text x="480" y="333.05" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">any drive or read-back failure</text>
<text x="480" y="351.175" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">      / reply …_FAIL, drive ALL relays OFF</text>
<polyline points="360,156 470,156" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="361.5" y="135.0" width="107.0" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="415" y="146" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">app_fsm_start()</text>
<rect x="364.4" y="163.0" width="101.3" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="415" y="174" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">/ all relays OFF</text>
<path d="M 760 100 C 760 48, 880 48, 880 100" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#filled-ink)"/>
<rect x="739.8" y="54.5" width="160.4" height="16.5" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="820" y="66" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">line received / handle it</text>
<rect x="110" y="270" width="300" height="190" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="260.0" y="290" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">Notes</text>
<line x1="110" y1="302.3" x2="410" y2="302.3" stroke="#b45309" stroke-width="1"/>
<text x="120" y="321.3" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">No final state: runs until power-off.</text>
<text x="120" y="338.7" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">A reset starts again in INIT, with</text>
<text x="120" y="356.1" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">every relay OFF.</text>
<text x="120" y="373.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve"></text>
<text x="120" y="390.9" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">One line is handled completely</text>
<text x="120" y="408.3" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">(including the 15 ms wait) before the</text>
<text x="120" y="425.7" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">next one, so commands never overlap.</text>
<text x="30" y="530.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">Plain words: after start-up the controller waits for a line of text. If it is a valid command it</text>
<text x="30" y="548.75" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">carries it out and answers; if anything goes wrong it switches every relay off and says _FAIL;</text>
<text x="30" y="567.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">if the text isn&#x27;t a command it answers UNK_NACK and changes nothing.</text>
</svg>
