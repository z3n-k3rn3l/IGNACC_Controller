erWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="open-green" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#15803d" stroke-width="1.6"/></marker><marker id="hollow-green" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="diamond-green" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="filled-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="open-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#2563eb" stroke-width="1.6"/></marker><marker id="hollow-blue" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker><marker id="diamond-blue" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker></defs>
<rect x="0" y="0" width="1210" height="640" fill="#ffffff"/>
<text x="30" y="36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="bold" fill="#1f2937">Module: main (composition root)</text>
<text x="30" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4b5563">The only place that knows the board: reads the configuration, checks it, and connects the pieces.</text>
<rect x="40" y="90" width="300" height="160" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="190.0" y="110" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" font-style="italic" xml:space="preserve">«build-time settings»</text>
<text x="190.0" y="127" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">Kconfig.projbuild</text>
<line x1="40" y1="139.3" x2="340" y2="139.3" stroke="#0e7490" stroke-width="1"/>
<text x="50" y="158.3" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">menuconfig → IGNACC Controller</text>
<text x="50" y="175.70000000000002" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">relays · UART · tasks</text>
<text x="50" y="193.10000000000002" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">channel count 1–14</text>
<text x="50" y="210.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">one GPIO per channel</text>
<rect x="40" y="320" width="300" height="130" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="190.0" y="340" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" font-style="italic" xml:space="preserve">«generated»</text>
<text x="190.0" y="357" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">sdkconfig.h</text>
<line x1="40" y1="369.3" x2="340" y2="369.3" stroke="#0e7490" stroke-width="1"/>
<text x="50" y="387.8" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">CONFIG_IGNACC_RELAY_COUNT 2</text>
<text x="50" y="404.475" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">CONFIG_IGNACC_RELAY1_GPIO 26</text>
<text x="50" y="421.15000000000003" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">…</text>
<text x="50" y="437.82500000000005" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">CONFIG_IGNACC_RELAY14_GPIO 23</text>
<polyline points="190,250 190,320" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="171.4" y="279.0" width="37.2" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="190" y="290" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">build</text>
<rect x="410" y="90" width="360" height="360" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="590.0" y="110" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" font-style="italic" xml:space="preserve">«compile time»</text>
<text x="590.0" y="127" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">main.c: compile-time checks</text>
<line x1="410" y1="139.3" x2="770" y2="139.3" stroke="#0e7490" stroke-width="1"/>
<text x="420" y="158.3" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">X-macro list: (channel, gpio) × 14</text>
<text x="420" y="175.70000000000002" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">s_relay_gpios[] = all 14 pins</text>
<text x="420" y="193.10000000000002" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve"></text>
<text x="420" y="210.5" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">for every channel ≤ count:</text>
<text x="420" y="227.9" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">  static_assert  safe pin</text>
<text x="420" y="245.3" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">  static_assert  not a UART pin</text>
<text x="420" y="262.7" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve"></text>
<text x="420" y="280.1" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">popcount(pin bit mask) == count</text>
<text x="420" y="297.5" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">  → no two channels share a GPIO</text>
<text x="420" y="314.9" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve"></text>
<text x="420" y="332.3" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">bad config → the build FAILS</text>
<text x="420" y="349.7" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">with a clear message</text>
<polyline points="340,385 410,385" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="840" y="90" width="330" height="360" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="1005.0" y="110" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" font-style="italic" xml:space="preserve">«run time»</text>
<text x="1005.0" y="127" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">app_main()</text>
<line x1="840" y1="139.3" x2="1170" y2="139.3" stroke="#2563eb" stroke-width="1"/>
<text x="850" y="158.3" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">1  create count × relay_gpio</text>
<text x="850" y="175.70000000000002" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">   (each latched OFF first)</text>
<text x="850" y="193.10000000000002" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">2  create the command queue</text>
<text x="850" y="210.5" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">3  start uart_link → link_tx_t</text>
<text x="850" y="227.9" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">4  app_fsm_create(relays, link,</text>
<text x="850" y="245.3" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">     version, settle, delay)</text>
<text x="850" y="262.7" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">5  app_fsm_start → all OFF</text>
<text x="850" y="280.1" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">6  app_fsm_task_start</text>
<text x="850" y="297.5" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve"></text>
<text x="850" y="314.9" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">any failure → halt()</text>
<text x="850" y="332.3" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">(relays stay OFF)</text>
<polyline points="770,270 840,270" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="777.7" y="251.0" width="54.6" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="805" y="262" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">compiles</text>
<rect x="40" y="500" width="1130" height="90" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="605.0" y="520" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">Why this matters</text>
<line x1="40" y1="532.3" x2="1170" y2="532.3" stroke="#b45309" stroke-width="1"/>
<text x="50" y="551.3" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">Every other module receives plain structs (pins, relays, link, delay) instead of reading sdkconfig, so they run on a PC with mocks and</text>
<text x="50" y="568.6999999999999" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">can be reused on another board. Changing the board means changing menuconfig and, at most, main.c.</text>
</svg>
