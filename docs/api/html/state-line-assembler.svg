<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="t d">
<title id="t">State machine: line_assembler</title>
<desc id="d">Turns the stream of received bytes into complete command lines.</desc>
<defs><marker id="filled-ink" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="open-ink" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#374151" stroke-width="1.6"/></marker><marker id="hollow-ink" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#374151" stroke-width="1.3"/></marker><marker id="diamond-ink" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#374151" stroke-width="1.3"/></marker><marker id="filled-red" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="open-red" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#b91c1c" stroke-width="1.6"/></marker><marker id="hollow-red" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#b91c1c" stroke-width="1.3"/></marker><marker id="diamond-red" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#b91c1c" stroke-width="1.3"/></marker><marker id="filled-green" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="open-green" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#15803d" stroke-width="1.6"/></marker><marker id="hollow-green" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="diamond-green" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="filled-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="open-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#2563eb" stroke-width="1.6"/></marker><marker id="hollow-blue" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker><marker id="diamond-blue" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker></defs>
<rect x="0" y="0" width="1040" height="540" fill="#ffffff"/>
<text x="30" y="36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="bold" fill="#1f2937">State machine: line_assembler</text>
<text x="30" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4b5563">Turns the stream of received bytes into complete command lines.</text>
<circle cx="70" cy="255" r="10" fill="#1f2937"/>
<rect x="150" y="200" width="270" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="285.0" y="220" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">COLLECTING</text>
<line x1="150" y1="232.3" x2="420" y2="232.3" stroke="#16a34a" stroke-width="1"/>
<text x="285.0" y="251.3" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">store each byte</text>
<text x="285.0" y="268.7" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">(up to max_len + 1, room for one &#x27;\r&#x27;)</text>
<rect x="640" y="200" width="270" height="110" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="775.0" y="220" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">DISCARDING</text>
<line x1="640" y1="232.3" x2="910" y2="232.3" stroke="#b91c1c" stroke-width="1"/>
<text x="775.0" y="251.3" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">drop every byte</text>
<text x="775.0" y="268.7" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">until the next &#x27;\n&#x27;</text>
<polyline points="80,255 150,255" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<path d="M 360 200 C 430 120, 610 120, 680 200" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#filled-ink)"/>
<rect x="369.7" y="110.5" width="300.6" height="16.5" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="520" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">byte would make the line longer than max_len + 1</text>
<rect x="397.1" y="128.5" width="245.7" height="16.5" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="520" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">or UART overflow / frame / parity error</text>
<path d="M 680 310 C 610 390, 430 390, 360 310" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#filled-ink)"/>
<rect x="381.9" y="372.5" width="276.2" height="16.5" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="520" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">&#x27;\n&#x27;  / nothing emitted (whole line dropped)</text>
<path d="M 200 200 C 170 120, 290 120, 270 199" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#filled-ink)"/>
<rect x="137.6" y="93.0" width="188.7" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="232" y="104" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">&#x27;\n&#x27; / strip one trailing &#x27;\r&#x27;;</text>
<rect x="137.6" y="109.0" width="188.7" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="232" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">emit the line if it isn&#x27;t empty</text>
<path d="M 860 310 C 900 390, 780 390, 800 311" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#filled-ink)"/>
<rect x="776.4" y="393.0" width="107.1" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="830" y="404" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">UART error / stay</text>
<text x="30" y="450.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">max_len is 32 by default (menuconfig). A command hidden at the end of a too-long line is never</text>
<text x="30" y="468.75" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">executed, and a line corrupted by a UART error is never passed on: both are dropped, silently.</text>
</svg>
