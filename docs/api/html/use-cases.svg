erWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="open-green" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#15803d" stroke-width="1.6"/></marker><marker id="hollow-green" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="diamond-green" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="filled-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="open-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#2563eb" stroke-width="1.6"/></marker><marker id="hollow-blue" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker><marker id="diamond-blue" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker></defs>
<rect x="0" y="0" width="1120" height="690" fill="#ffffff"/>
<text x="30" y="36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="bold" fill="#1f2937">Use cases: who uses the system, and for what</text>
<text x="30" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4b5563">Each figure is a user; each oval is one thing they can do with the system.</text>
<rect x="300" y="80" width="530" height="560" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="320" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#334155" xml:space="preserve">IGNACC Controller (firmware + tester)</text>
<ellipse cx="565" cy="150" rx="175" ry="31" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="565" y="146.25" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Check the board is alive</text>
<text x="565" y="162.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">(HeyU)</text>
<ellipse cx="565" cy="225" rx="175" ry="31" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="565" y="221.25" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Switch one relay</text>
<text x="565" y="237.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">(IN&lt;n&gt;_ON / IN&lt;n&gt;_OFF)</text>
<ellipse cx="565" cy="300" rx="175" ry="31" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="565" y="296.25" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Switch all relays at once</text>
<text x="565" y="312.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">(ALL_ON / ALL_OFF)</text>
<ellipse cx="565" cy="375" rx="175" ry="31" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="565" y="371.25" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Read every relay&#x27;s state</text>
<text x="565" y="387.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">(STATUS)</text>
<ellipse cx="565" cy="450" rx="175" ry="31" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="565" y="446.25" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Be told a command is invalid</text>
<text x="565" y="462.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">(UNK_NACK)</text>
<ellipse cx="565" cy="525" rx="175" ry="31" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="565" y="521.25" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Run the automated self-test</text>
<text x="565" y="537.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">(IGNACC Tester)</text>
<ellipse cx="565" cy="600" rx="175" ry="31" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="565" y="596.25" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Configure channels and pins,</text>
<text x="565" y="612.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">build and flash the firmware</text>
<circle cx="150" cy="150" r="11" fill="#fff" stroke="#1f2937" stroke-width="1.8"/>
<path d="M150,161 L150,194 M130,172 L170,172 M150,194 L134,218 M150,194 L166,218" stroke="#1f2937" stroke-width="1.8" fill="none"/>
<text x="150" y="238" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">Test engineer</text>
<rect x="55" y="360" width="190" height="76" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="150" y="382" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" font-style="italic" xml:space="preserve">«system actor»</text>
<text x="150" y="402" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">CANoe / CAPL</text>
<text x="150" y="420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">test script</text>
<circle cx="990" cy="470" r="11" fill="#fff" stroke="#1f2937" stroke-width="1.8"/>
<path d="M990,481 L990,514 M970,492 L1010,492 M990,514 L974,538 M990,514 L1006,538" stroke="#1f2937" stroke-width="1.8" fill="none"/>
<text x="990" y="558" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">Firmware</text>
<text x="990" y="574" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">developer</text>
<polyline points="172,172 390,150" fill="none" stroke="#374151" stroke-width="1.3" stroke-linejoin="round"/>
<polyline points="172,172 390,225" fill="none" stroke="#374151" stroke-width="1.3" stroke-linejoin="round"/>
<polyline points="172,172 390,300" fill="none" stroke="#374151" stroke-width="1.3" stroke-linejoin="round"/>
<polyline points="172,172 390,375" fill="none" stroke="#374151" stroke-width="1.3" stroke-linejoin="round"/>
<polyline points="172,172 390,525" fill="none" stroke="#374151" stroke-width="1.3" stroke-linejoin="round"/>
<polyline points="245,398 390,150" fill="none" stroke="#374151" stroke-width="1.3" stroke-linejoin="round"/>
<polyline points="245,398 390,225" fill="none" stroke="#374151" stroke-width="1.3" stroke-linejoin="round"/>
<polyline points="245,398 390,300" fill="none" stroke="#374151" stroke-width="1.3" stroke-linejoin="round"/>
<polyline points="245,398 390,375" fill="none" stroke="#374151" stroke-width="1.3" stroke-linejoin="round"/>
<polyline points="968,492 740,525" fill="none" stroke="#374151" stroke-width="1.3" stroke-linejoin="round"/>
<polyline points="968,492 740,600" fill="none" stroke="#374151" stroke-width="1.3" stroke-linejoin="round"/>
<polyline points="740,450 790,450 790,228 742,228" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#open-ink)"/>
<rect x="761.6" y="328.5" width="56.8" height="16.5" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="790" y="340" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">«extend»</text>
<text x="30" y="660.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">UNK_NACK «extends» switching: it is what happens when the command text is wrong, or names a relay the board doesn&#x27;t have.</text>
</svg>
