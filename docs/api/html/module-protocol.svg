<rect x="40" y="380" width="1030" height="230" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="555.0" y="400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">Grammar  (exact match, case-sensitive; every reply ends with \r\n)</text>
<line x1="40" y1="412.3" x2="1070" y2="412.3" stroke="#6b7280" stroke-width="1"/>
<text x="50" y="431.3" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">IN&lt;n&gt;_ON | IN&lt;n&gt;_OFF    n = 1..16, no leading zeros     →  IN&lt;n&gt;_ON_OK / IN&lt;n&gt;_OFF_FAIL / …</text>
<text x="50" y="448.7" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">ALL_ON   | ALL_OFF                                       →  ALL_ON_OK  / ALL_OFF_FAIL  / …</text>
<text x="50" y="466.1" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">HeyU                                                     →  Hello IGNACC v&lt;version&gt; READY</text>
<text x="50" y="483.5" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">STATUS                                                   →  STATUS IN1=ON IN2=OFF …  (one per channel)</text>
<text x="50" y="500.9" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">anything else: IN0_ON, IN01_ON, IN17_ON, in1_on, &#x27;IN1_ON &#x27;  →  UNK_NACK</text>
<text x="50" y="518.3" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve"></text>
<text x="50" y="535.7" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">The protocol accepts IN1..IN16. Whether channel n exists on this board is decided by app_fsm</text>
<text x="50" y="553.1" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" xml:space="preserve">(n &gt; channel count → UNK_NACK), so the channel count can change without touching this module.</text>
</svg>
