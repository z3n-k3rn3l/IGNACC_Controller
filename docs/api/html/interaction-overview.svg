erWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="open-green" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#15803d" stroke-width="1.6"/></marker><marker id="hollow-green" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="diamond-green" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="filled-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="open-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#2563eb" stroke-width="1.6"/></marker><marker id="hollow-blue" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker><marker id="diamond-blue" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker></defs>
<rect x="0" y="0" width="940" height="1000" fill="#ffffff"/>
<text x="30" y="36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="bold" fill="#1f2937">Interaction overview: a whole test session</text>
<text x="30" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4b5563">Each &#x27;ref&#x27; box is a smaller interaction shown in its own sequence diagram.</text>
<circle cx="420" cy="92" r="10" fill="#1f2937"/>
<rect x="200.0" y="129.0" width="440" height="62" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<path d="M200.0,129.0 h34 v11 l-6,7 h-28 z" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<text x="206.0" y="142.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#2563eb" xml:space="preserve">ref</text>
<text x="420" y="160" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">Handshake: HeyU → Hello IGNACC v… READY</text>
<text x="420" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">retry until it answers (board may be booting)</text>
<polyline points="420,102 420,129" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="200.0" y="230.0" width="440" height="56" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<path d="M200.0,230.0 h34 v11 l-6,7 h-28 z" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
<text x="206.0" y="243.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#15803d" xml:space="preserve">ref</text>
<text x="420" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">Safe start: ALL_OFF → ALL_OFF_OK</text>
<text x="420" y="276" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">every relay OFF before the first step</text>
<polyline points="420,191 420,230" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<polygon points="420,318 432,330 420,342 408,330" fill="#fff" stroke="#374151" stroke-width="1.5"/>
<polyline points="420,286 420,318" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<polygon points="420,377.0 515.0,410 420,443.0 325.0,410" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
<text x="420" y="414.2" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">More test steps?</text>
<polyline points="420,342 420,377" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="200.0" y="477.0" width="440" height="62" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<path d="M200.0,477.0 h34 v11 l-6,7 h-28 z" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<text x="206.0" y="490.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#2563eb" xml:space="preserve">ref</text>
<text x="420" y="508" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">Switch: IN&lt;n&gt;_ON / IN&lt;n&gt;_OFF / ALL_…</text>
<text x="420" y="526" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">see sequence-relay-command</text>
<polyline points="420,443 420,477" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="440.0" y="455.0" width="37.2" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="444" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">[yes]</text>
<polygon points="420,576.0 495.0,606 420,636.0 345.0,606" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
<text x="420" y="610.2" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Reply?</text>
<polyline points="420,539 420,576" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="200.0" y="672.0" width="440" height="56" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<path d="M200.0,672.0 h34 v11 l-6,7 h-28 z" fill="#ffffff" stroke="#0369a1" stroke-width="1.2"/>
<text x="206.0" y="685.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#0369a1" xml:space="preserve">ref</text>
<text x="420" y="700" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">Send the matching CAN signal (CAPL)</text>
<text x="420" y="718" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">only after _OK</text>
<polyline points="420,636 420,672" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="440.0" y="649.0" width="37.2" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="444" y="660" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">[_OK]</text>
<polyline points="200,700 150,700 150,330 408,330" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="575.0" y="571.0" width="230" height="70" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<path d="M575.0,571.0 h34 v11 l-6,7 h-28 z" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
<text x="581.0" y="584.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#b91c1c" xml:space="preserve">ref</text>
<text x="690" y="606" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">Stop and log</text>
<text x="690" y="624" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">board already safe on _FAIL</text>
<polyline points="495,606 575,606" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-red)"/>
<rect x="449.2" y="617.5" width="141.6" height="15.5" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="520" y="628" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#b91c1c" xml:space="preserve">[_FAIL / NACK / timeout]</text>
<polyline points="690,641 690,690" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-red)"/>
<circle cx="690" cy="703" r="12" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<circle cx="690" cy="703" r="7" fill="#1f2937"/>
<rect x="200.0" y="802.0" width="440" height="56" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<path d="M200.0,802.0 h34 v11 l-6,7 h-28 z" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
<text x="206.0" y="815.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#15803d" xml:space="preserve">ref</text>
<text x="420" y="830" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937" xml:space="preserve">Safe end: ALL_OFF → ALL_OFF_OK</text>
<text x="420" y="848" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">bench left with every relay OFF</text>
<polyline points="515,410 870,410 870,830 640,830" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="764.3" y="391.0" width="31.3" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="780" y="402" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#4b5563" xml:space="preserve">[no]</text>
<circle cx="420" cy="910" r="12" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<circle cx="420" cy="910" r="7" fill="#1f2937"/>
<polyline points="420,858 420,897" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<text x="30" y="952.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">Plain words: say hello, switch everything off, then repeat &#x27;switch a relay, wait for OK, send the CAN signal&#x27;; stop at the first problem; finish by switching everything off.</text>
</svg>
