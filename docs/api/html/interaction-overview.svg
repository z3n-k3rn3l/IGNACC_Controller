<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1000" viewBox="0 0 940 1000" role="img" aria-labelledby="t d">
<title id="t">Interaction overview: a whole test session</title>
<desc id="d">Each &#x27;ref&#x27; box is a smaller interaction shown in its own sequence diagram.</desc>
