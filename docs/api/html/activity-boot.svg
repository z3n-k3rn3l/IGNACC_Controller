<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1000" viewBox="0 0 980 1000" role="img" aria-labelledby="t d">
<title id="t">Activity: power-on to READY</title>
<desc id="d">What happens between switching the board on and the first command being accepted.</desc>
<defs><marker id="filled-ink" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="open-ink" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#374151" stroke-width="1.6"/></marker><marker id="hollow-ink" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#374151" stroke-width="1.3"/></marker><marker id="diamond-ink" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#374151" stroke-width="1.3"/></marker><marker id="filled-red" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="open-red" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#b91c1c" stroke-width="1.6"/></marker><marker id="hollow-red" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#b91c1c" stroke-width="1.3"/></marker><marker id="diamond-red" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#b91c1c" stroke-width="1.3"/></marker><marker id="filled-green" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="open-green" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#15803d" stroke-width="1.6"/></marker><marker id="hollow-green" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="diamond-green" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#15803d" stroke-width="1.3"/></marker><marker id="filled-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="open-blue" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#2563eb" stroke-width="1.6"/></marker><marker id="hollow-blue" viewBox="0 0 12 12" refX="11.4" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.5 L11.5,6 L0.5,11.5 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker><marker id="diamond-blue" viewBox="0 0 16 10" refX="0.6" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,5 L8,0.6 L15.5,5 L8,9.4 z" fill="#fff" stroke="#2563eb" stroke-width="1.3"/></marker></defs>
<rect x="0" y="0" width="980" height="1000" fill="#ffffff"/>
<text x="30" y="36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="bold" fill="#1f2937">Activity: power-on to READY</text>
<text x="30" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4b5563">What happens between switching the board on and the first command being accepted.</text>
<circle cx="420" cy="92" r="10" fill="#1f2937"/>
<rect x="436.0" y="84.5" width="105.5" height="16.5" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="440" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">power on / reset</text>
<rect x="160.0" y="125.0" width="520" height="50" rx="18" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
<text x="420" y="145.9375" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">ROM bootloader runs (prints its boot text on UART0;</text>
<text x="420" y="162.8125" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">the application can&#x27;t disable this)</text>
<polyline points="420,102 420,125" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="160.0" y="202.0" width="520" height="40" rx="18" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
<text x="420" y="226.375" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">2nd-stage bootloader (silent: logs off)</text>
<polyline points="420,175 420,202" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="270.0" y="266.0" width="300" height="40" rx="18" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="420" y="290.375" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">app_main() starts</text>
<polyline points="420,242 420,266" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="150" y="320" width="540" height="250" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="166" y="342" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#4b5563" font-style="italic" xml:space="preserve">for each channel 1 … count</text>
<rect x="210.0" y="358.0" width="420" height="44" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="420" y="384.375" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Write the OFF level to the pin</text>
<polyline points="420,306 420,358" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="210.0" y="424.0" width="420" height="44" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="420" y="450.375" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Then switch the pin to output (no ON glitch)</text>
<polyline points="420,402 420,424" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<polygon points="420,492.0 525.0,522 420,552.0 315.0,522" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
<text x="420" y="526.2" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Pin reads back OFF?</text>
<polyline points="420,468 420,492" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="660.0" y="612.0" width="280" height="76" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="800" y="637.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">halt(): stop here.</text>
<text x="800" y="654.375" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Relays stay OFF; HeyU gets</text>
<text x="800" y="671.25" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">no reply (host times out).</text>
<polyline points="525,522 800,522 800,612" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-red)"/>
<rect x="634.3" y="503.0" width="31.3" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="650" y="514" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#b91c1c" xml:space="preserve">[no]</text>
<rect x="240.0" y="610.0" width="360" height="40" rx="18" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="420" y="634.375" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Create the command queue</text>
<polyline points="420,552 420,610" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="438.0" y="579.0" width="118.8" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="442" y="590" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">[yes, all channels]</text>
<rect x="240.0" y="670.0" width="360" height="40" rx="18" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="420" y="694.375" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Start the UART link (driver + RX task)</text>
<polyline points="420,650 420,670" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="240.0" y="730.0" width="360" height="40" rx="18" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="420" y="754.375" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Create the state machine; drive ALL OFF</text>
<polyline points="420,710 420,730" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<rect x="240.0" y="790.0" width="360" height="40" rx="18" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="420" y="814.375" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">Start the state-machine task</text>
<polyline points="420,770 420,790" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<polyline points="600,750 660,750 660,688" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#filled-red)"/>
<rect x="669.9" y="749.0" width="72.1" height="16.0" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="706" y="760" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#b91c1c" xml:space="preserve">any failure</text>
<rect x="240.0" y="867.0" width="360" height="46" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="420" y="894.375" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2937" xml:space="preserve">READY: waiting for commands</text>
<polyline points="420,830 420,867" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#filled-ink)"/>
<text x="30" y="950.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" xml:space="preserve">From power-on to READY takes well under a second. Until then, relay pins are inputs or OFF, so a relay never switches ON during boot.</text>
</svg>
